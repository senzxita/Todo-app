- name: Update all packages
  dnf:
    name: '*'
    state: latest

- name: Ensure firewalld is installed
  package:
    name: firewalld
    state: present

- name: Enable and start firewalld
  service:
    name: firewalld
    state: started
    enabled: yes

- name: Allow HTTP and HTTPS services through the firewall
  firewalld:
    service: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop:
    - http
    - https

- name: Ensure SELinux is in enforcing mode
  selinux:
    state: enforcing
    policy: targeted